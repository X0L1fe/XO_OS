[project]
name = "xo_os"
version = "0.1.0"
description = "description = "XO_OS — personal productivity OS for students: ICS import, Google Calendar sync, Obsidian export, Telegram bot, FastAPI, gamification (XP/levels/streaks), and incremental sync with conflict resolution.""
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.11,<3.0",
    "icalendar>=6.3,<7.0",
    "python-dateutil>=2.9,<3.0",
    "httpx>=0.23,<0.27",
    "passlib[bcrypt]>=1.7.4,<2.0",          
    "python-multipart>=0.0.5,<1.0",       
    "email-validator>=2.0,<3.0",           
    "PyYAML>=6.0,<7.0",                   
    "python-dotenv>=1.0,<2.0",            
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
]

google = [
    "google-api-python-client>=2.140,<3.0",
    "google-auth-httplib2>=0.2,<1.0",
    "google-auth-oauthlib>=1.2,<2.0",
]

telegram = [
    "python-telegram-bot>=20.0,<21.0",
]

[project.scripts]
xo-os = "app.cli:main"
xo-os-bot = "app.telegram_bot:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "frontend*", "tests*"]